[package]
name = "winpilot"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
base64 = "0.22"
crossbeam-channel = "0.5.17"
eframe = "0.36.2"
egui = "0.36"
png = "0.18"
rmcp = { version = "=3.4.1", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading"] }
windows-capture = "2"

# 预览链路（像素转换 + egui 布局）是 CPU 密集的，依赖跑 O0 时 debug 构建只能到 ~40fps，
# 画面延迟明显。依赖优化到 O2，本 crate 仍保留调试信息与断点。
[profile.dev.package."*"]
opt-level = 2
